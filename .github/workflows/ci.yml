name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        working-directory: backend
        env:
          # Tests run entirely against seeded data with no outbound calls, so
          # CI never depends on a third-party endpoint being up.
          APP_ENV: DEMO
          ENABLE_SCHEDULER: "false"
          ENABLE_NSE_PROVIDER: "false"
          SECRET_KEY: ci-only-secret-not-used-anywhere-real
          QUOTE_PROVIDERS: demo
          HISTORY_PROVIDERS: demo
          OPTION_CHAIN_PROVIDERS: demo
          NEWS_PROVIDERS: demo
          IPO_PROVIDERS: demo
        run: python -m pytest -q

      - name: Check the app boots and serves its compliance config
        working-directory: backend
        env:
          APP_ENV: DEMO
          ENABLE_SCHEDULER: "false"
          SECRET_KEY: ci-only-secret-not-used-anywhere-real
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app.main as m

          with TestClient(m.app) as client:
              root = client.get("/").json()
              compliance = client.get("/api/config/compliance").json()

          # The deployment ships with no registration configured, so it must
          # never claim one. This is a compliance guard, not a smoke test.
          assert root["verified"] is False, root
          assert compliance["verification_badge"] is None, compliance
          assert compliance["is_registered"] is False, compliance
          print("boot OK ·", root["descriptor"])
          PY

  frontend:
    name: Frontend · typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets:
    name: Guard · no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse committed environment files or databases
        run: |
          set -e
          bad=$(git ls-files \
            | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$|\.db$|\.sqlite3$|(^|/)storage/' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No environment files, databases or uploaded documents committed."

      - name: Refuse a real-looking secret
        run: |
          set -e
          # Placeholders are the whole point of .env.example, so this check has
          # to tell "change-me-before-you-deploy-anything" apart from an actual
          # secret. A value that advertises itself as a placeholder passes;
          # anything else that looks like a credential does not.
          hits=$(git ls-files -z \
            | xargs -0 grep -InE '(SECRET_KEY|API_SECRET|BOT_TOKEN|ACCESS_TOKEN)[[:space:]]*[:=][[:space:]]*["'\'']?[A-Za-z0-9_/+-]{24,}' \
            | grep -vE '^\.github/workflows/' \
            | grep -viE 'change-?me|ci-only|insecure|placeholder|example|your-|replace|not-used|dummy|redacted|<[^>]+>|\$\{' \
            || true)
          if [ -n "$hits" ]; then
            echo "A real-looking secret appears to be committed:"
            # Report file and line only - never echo the value itself.
            echo "$hits" | cut -d: -f1,2
            exit 1
          fi
          echo "No committed secret detected."

  deploy:
    name: Deploy · Render
    runs-on: ubuntu-latest
    # Render is connected to this repo by its public URL, which carries no
    # GitHub webhook - so Render's own "auto-deploy on commit" can never fire.
    # This job replaces it, and improves on it: Render would have deployed
    # every push regardless of whether the suite was green, whereas this runs
    # only after all three checks pass.
    needs: [backend, frontend, secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger the deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set. Add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi
          # -o/-w rather than plain curl: the hook URL carries a key, and the
          # response body echoes the deploy id, so neither is printed.
          code=$(curl -fsS -X POST "$HOOK" -o response.json -w '%{http_code}')
          echo "Render accepted the deploy request (HTTP $code)."
          python -c "
          import json
          with open('response.json') as fh:
              payload = json.load(fh)
          deploy = payload.get('deploy') or {}
          print('deploy id:', deploy.get('id', 'unknown'))
          print('status:   ', deploy.get('status', 'queued'))
          "

      - name: Wait for the new build to go live
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "API_BASE_URL not set - skipping the post-deploy check."
            echo "The deploy was still triggered."
            exit 0
          fi
          # A build takes a few minutes on the free tier, and the instance may
          # also be cold. Poll rather than sleeping a fixed guess.
          for i in $(seq 1 40); do
            sleep 20
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' \
              "$API_BASE_URL/api/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is serving again."
              exit 0
            fi
          done
          echo "::warning::API did not respond 200 within the window."
          echo "The deploy may still be building - check the Render dashboard."
